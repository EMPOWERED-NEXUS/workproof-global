name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  ACCESS_TOKEN_SECRET: ci-access-token-secret-minimum-32-chars
  ACCESS_TOKEN_EXPIRES_IN: 15m
  REFRESH_TOKEN_EXPIRES_DAYS: "30"
  FRONTEND_URL: http://localhost:5173
  ALLOWED_ORIGINS: http://localhost:5173
  COOKIE_SECURE: "false"
  ENABLE_API_DOCS: "false"
  DATABASE_URL: postgresql://workproof:workproof_test@localhost:5432/workproof_test?schema=public
  TEST_DATABASE_URL: postgresql://workproof:workproof_test@localhost:5432/workproof_test?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workproof
          POSTGRES_PASSWORD: workproof_test
          POSTGRES_DB: workproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workproof -d workproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Deploy test migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Typecheck shared
        run: npm run typecheck --workspace=@workproof/shared

      - name: Typecheck API
        run: npm run typecheck --workspace=@workproof/api

      - name: Typecheck web
        run: npm run typecheck --workspace=@workproof/web

      - name: Typecheck mobile
        run: npm run typecheck --workspace=@workproof/mobile

      - name: Lint web
        run: npm run lint --workspace=@workproof/web

      - name: API tests
        run: npm run test --workspace=@workproof/api

      - name: Build shared
        run: npm run build --workspace=@workproof/shared

      - name: Build API
        run: npm run build --workspace=@workproof/api

      - name: Build web
        run: npm run build --workspace=@workproof/web
