name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  ACCESS_TOKEN_SECRET: ci-access-token-secret-minimum-32-chars
  ACCESS_TOKEN_EXPIRES_IN: 15m
  REFRESH_TOKEN_EXPIRES_DAYS: "30"
  FRONTEND_URL: http://localhost:5173
  WEB_APP_URL: http://localhost:5173
  ALLOWED_ORIGINS: http://localhost:5173
  COOKIE_SECURE: "false"
  ENABLE_API_DOCS: "false"
  STORAGE_PROVIDER: local
  LOCAL_STORAGE_DIR: uploads-ci
  EMAIL_PROVIDER: console
  EMAIL_PAYLOAD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  ALLOW_DEV_VERIFICATION_TOKEN: "true"
  ALLOW_DEV_PASSWORD_RESET_TOKEN: "true"
  DATABASE_URL: postgresql://workproof:workproof_test@localhost:5432/workproof_test?schema=public
  TEST_DATABASE_URL: postgresql://workproof:workproof_test@localhost:5432/workproof_test?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workproof
          POSTGRES_PASSWORD: workproof_test
          POSTGRES_DB: workproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workproof -d workproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Prisma engines are not tracked
        run: |
          if git ls-files | grep -E 'apps/api/generated/prisma/.*(query_engine|libquery_engine|schema\.prisma)$' ; then
            echo "Generated Prisma artifacts must not be tracked" >&2
            exit 1
          fi

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Deploy test migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Typecheck shared
        run: npm run typecheck --workspace=@workproof/shared

      - name: Build shared
        run: npm run build:shared

      - name: Typecheck API
        run: npm run typecheck --workspace=@workproof/api

      - name: Typecheck web
        run: npm run typecheck --workspace=@workproof/web

      - name: Typecheck mobile
        run: npm run typecheck --workspace=@workproof/mobile

      - name: Lint web
        run: npm run lint --workspace=@workproof/web

      - name: API tests
        run: npm run test --workspace=@workproof/api

      - name: Build API
        run: npm run build --workspace=@workproof/api

      - name: Build web
        run: npm run build --workspace=@workproof/web

      - name: Validate Nginx SPA config
        run: |
          test -f deploy/nginx/web.conf
          grep -q 'try_files \$uri \$uri/ /index.html' deploy/nginx/web.conf
          grep -q 'immutable' deploy/nginx/web.conf

      - name: Secret pattern scan (basic)
        run: |
          set +e
          hits=$(grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=generated --exclude=package-lock.json \
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9._-]{20,}|EMAIL_API_KEY[[:space:]]*=[[:space:]]*["'"'"']?re_[A-Za-z0-9]+|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
            . 2>/dev/null)
          set -e
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Potential secret material found" >&2
            exit 1
          fi
          echo "Basic secret scan passed"

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t workproof-api:ci .

      - name: Build web Docker image
        run: docker build -f Dockerfile.web --build-arg VITE_API_URL=/api/v1 -t workproof-web:ci .
