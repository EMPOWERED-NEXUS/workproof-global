name: Publish WorkProof API Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.api"
      - "apps/api/**"
      - "packages/shared/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-workproof-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: workproof-global-api
  AWS_ROLE_ARN: arn:aws:iam::014516479114:role/WorkProofGlobalGitHubDeploy

jobs:
  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: workproof-api-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate immutable image reference
        id: image
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Publish image summary
        shell: bash
        run: |
          {
            echo "## WorkProof API image published"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
