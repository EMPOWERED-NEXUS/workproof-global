services:
  postgres:
    image: postgres:16-alpine
    container_name: workproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workproof
      POSTGRES_USER: workproof
      POSTGRES_PASSWORD: workproof_dev_password
    ports:
      - "5434:5432"
    volumes:
      - workproof_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workproof -d workproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workproof_pg_data:
